name: Build DIONService

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List all files (Debug)
      run: |
        Write-Host "=== Repository Structure ==="
        Get-ChildItem -Recurse -Include *.sln,*.vcxproj,*.cpp,*.h | Select-Object FullName
      shell: pwsh
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Find and Build Solution
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if (-not $sln) {
          Write-Host "ERROR: No .sln file found!"
          exit 1
        }
        Write-Host "Found solution: $($sln.FullName)"
        Write-Host "Building..."
        msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64
      shell: pwsh
    
    - name: Find EXE
      run: |
        Write-Host "=== Searching for .exe ==="
        Get-ChildItem -Recurse -Filter "DIONService.exe" | Select-Object FullName
      shell: pwsh
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: DIONService-EXE
        path: '**/DIONService.exe'
        if-no-files-found: warn
