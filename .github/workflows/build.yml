name: Build DIONService

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List files
      run: Get-ChildItem -Recurse | Select-Object FullName
      shell: pwsh
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build DIONService
      run: |
        $slnx = Get-ChildItem -Recurse -Filter "*.slnx" | Select-Object -First 1
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        $vcxproj = Get-ChildItem -Recurse -Filter "*.vcxproj" | Select-Object -First 1
        
        if ($slnx) {
          Write-Host "Found .slnx: $($slnx.FullName)"
          # .slnx ใหม่ - ลองใช้ msbuild ตรงๆ
          msbuild $slnx.FullName /p:Configuration=Release /p:Platform=x64
        }
        elseif ($sln) {
          Write-Host "Found .sln: $($sln.FullName)"
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64
        }
        elseif ($vcxproj) {
          Write-Host "Found .vcxproj: $($vcxproj.FullName)"
          # Build vcxproj โดยตรง (ข้าม sln)
          msbuild $vcxproj.FullName /p:Configuration=Release /p:Platform=x64
        }
        else {
          Write-Host "ERROR: No project file found!"
          exit 1
        }
      shell: pwsh
    
    - name: Find and Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: DIONService-EXE
        path: '**/DIONService.exe'
        if-no-files-found: warn
