name: Build DIONService

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build DIONService.vcxproj (Direct)
      run: |
        Write-Host "=== Looking for .vcxproj ==="
        $vcxproj = Get-ChildItem -Recurse -Filter "DIONService.vcxproj" | Select-Object -First 1
        if (-not $vcxproj) {
          Write-Host "ERROR: DIONService.vcxproj not found!"
          Get-ChildItem -Recurse | Select-Object FullName
          exit 1
        }
        Write-Host "Found: $($vcxproj.FullName)"
        Write-Host "Building directly..."
        
        msbuild $vcxproj.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
      shell: pwsh
    
    - name: Find EXE
      run: |
        Write-Host "=== Searching for .exe ==="
        Get-ChildItem -Recurse -Filter "DIONService.exe" | Select-Object FullName
      shell: pwsh
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: DIONService-EXE
        path: '**/DIONService.exe'
        if-no-files-found: warn
